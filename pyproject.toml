[project]
name = "tftp-packet-kit"
version = "0.1.0"
description = "Converts TFTP packets to and from raw bytes per RFC 1350."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
